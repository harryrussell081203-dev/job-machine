# Runs the machine on GitHub's own hardware, free.
#
# Public repos get unlimited Actions minutes; private repos get 2,000 a month
# and this uses about three a day. There is no server, no domain and no
# database - state is one JSON file this workflow commits back to the repo.
name: job machine

on:
  schedule:
    # Cold outreach replies best Tuesday to Thursday, 9-11am in the reader's
    # time zone. GitHub cron is UTC and does not shift with British Summer
    # Time, so both 8 and 9 are scheduled: one of them lands in the window
    # whatever the season.
    - cron: "0 8 * * 2-4"
    - cron: "0 9 * * 2-4"
    # Monday and Friday still get a look, because being an early applicant
    # beats being a well-timed one.
    - cron: "0 8 * * 1,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the letters instead of emailing them"
        type: boolean
        default: false

# Needed so the run can commit state.json back.
permissions:
  contents: write

concurrency:
  group: job-machine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Look for work
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: |
          python -m jobseeker.cli \
            --profile profile.yaml \
            --state data/state.json \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # A free Supabase project pauses itself after about a week idle, and a
      # paused database means nobody can sign in - silently. This run happens
      # three times a weekday anyway, so it is the cheapest possible heartbeat.
      # Skipped entirely when no database is configured.
      - name: Keep the database awake
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # The guard lives here rather than in `if:`, because a step's own
          # `env:` block is not readable from its own `if:` - the condition
          # would see an empty string every time and the step would never run.
          if [ -z "${DATABASE_URL}" ]; then
            echo "no DATABASE_URL secret, so nothing to keep awake"
            exit 0
          fi
          pip install "psycopg[binary]" >/dev/null
          python - <<'PY'
          import os, sys, psycopg
          try:
              with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as c:
                  c.execute("SELECT 1")
              print("database awake")
          except Exception as exc:
              # Never fail the run for this - the letters matter more.
              print(f"could not reach the database: {exc}", file=sys.stderr)
          PY

      - name: Remember what was seen
        if: ${{ !inputs.dry_run }}
        run: |
          # Nothing to commit is the normal outcome on a quiet day, and must
          # not fail the run.
          git config user.name "job machine"
          git config user.email "actions@github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "state $(date -u +%Y-%m-%d_%H%M)"
          git push
