name: job-machine portal

# Opens employers' real application forms in a browser and fills them in.
# Heavier than the email run, so once a weekday morning.
on:
  schedule:
    - cron: "30 9,13,17 * * 1-5"   # three passes a weekday to work the backlog
  push:
    tags: ["fire-portal-*"]        # push a tag to force a run when the UI is not handy
    branches:
      - "fire-portal/**"           # fill forms in, stop before submitting
      - "fire-burn/**"             # re-open what the old bugs parked, then work the lot
      - "fire-submit/**"           # fill in AND submit, one application only
      - "fire-diagnose/**"         # just look at the pages, fill nothing
      - "fire-probe/**"            # ask the board APIs only - seconds, no browser
      - "fire-inspect/**"          # open employer-board apply pages, fill nothing
      - "fire-covenant/**"         # rebuild the Armed Forces Covenant list
  workflow_dispatch:
    inputs:
      submit:
        description: "Actually press submit on clean applications (true/false)"
        required: false
        default: "false"
      limit:
        description: "Max applications this run"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Its own group, no longer shared with run.yml. A concurrency group holds one
  # pending run and cancels any earlier pending one, so sharing meant portal
  # runs were deleting queued send runs outright - see the note in run.yml.
  # Two scorers overlapping costs some 429s, which the back-off already
  # handles. A cancelled send run costs the send.
  # Per branch, for the reason set out in run.yml: a group holds one pending
  # run, runs queue for a long time before a runner picks them up, and the
  # next push into the same group deletes the one already waiting.
  group: job-machine-portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests dnspython playwright reportlab
      - run: playwright install --with-deps chromium

      - name: Harvest a month and work the queue
        env:
          # Python block-buffers stdout when it is a pipe, which is
          # what Actions gives it. Every log in this repo was flushed
          # in one lump at exit, so a run that was killed printed
          # nothing at all - forty-five minutes of silence that read
          # like a hang and was really an empty buffer.
          PYTHONUNBUFFERED: "1"
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEARCH_LOCATIONS: ${{ vars.SEARCH_LOCATIONS }}
          SEARCH_RADIUS_MILES: ${{ vars.SEARCH_RADIUS_MILES }}
          SCORE_THRESHOLD: ${{ vars.SCORE_THRESHOLD }}
          # PORTAL_SUBMIT is unset by default, which means fill everything in,
          # screenshot it and stop short of pressing submit.
          PORTAL_SUBMIT: ${{ github.event.inputs.submit || vars.PORTAL_SUBMIT }}
          PORTAL_MAX_AGE_DAYS: ${{ vars.PORTAL_MAX_AGE_DAYS }}
          PORTAL_PER_RUN_CAP: ${{ vars.PORTAL_PER_RUN_CAP }}
          PORTAL_DAILY_CAP: ${{ vars.PORTAL_DAILY_CAP }}
          PORTAL_CIRCUIT_AFTER: ${{ vars.PORTAL_CIRCUIT_AFTER }}
          # Portal account passwords are DERIVED from this and the site's
          # domain, never stored - data/state.json is committed to a public
          # repository. No salt, no account creation.
          PORTAL_PASSWORD_SALT: ${{ secrets.PORTAL_PASSWORD_SALT }}
          # One password everywhere, Harry's own choice, so he can sign in to
          # these portals himself. Padded to whatever the site's rules demand.
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          BURN_LIMIT: ${{ vars.BURN_LIMIT }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == fire-covenant/* ]]; then
            # The MoD register of Covenant signatories. Every name on it is an
            # employer where being ex-forces moves Harry from the pile to the
            # shortlist, so this is the most valuable data in the project.
            echo "fire-covenant branch: rebuilding the Covenant list"
            # Report what the register really looks like before trusting a
            # scrape of it - the first attempt found 51 names out of thousands
            # because it assumed the wrong page structure.
            python tools/covenant_list.py --inspect || true
            python tools/covenant_list.py --write
            exit 0
          fi
          if [[ "${GITHUB_REF_NAME}" == fire-probe/* ]]; then
            # ground truth: what do the board APIs really answer for the
            # companies in the queue? No browser, no scoring, ~30 seconds.
            echo "fire-probe branch: querying the board APIs only"
            python ats_finder.py --check-queue 14
            exit 0
          fi
          if [[ "${GITHUB_REF_NAME}" == fire-inspect/* ]]; then
            # the roles found on employers' own boards arrive unscored, so they
            # sit outside the ordinary queue for days. Look at their apply
            # pages now: they are the ones that should simply work.
            echo "fire-inspect branch: opening employer application pages"
            python portal_agent.py --inspect 8
            exit 0
          fi
          if [[ "${GITHUB_REF_NAME}" == fire-diagnose/* ]]; then
            # reconnaissance only: open the pages, fill nothing, submit nothing
            echo "fire-diagnose branch: inspecting pages only"
            python portal_agent.py --harvest --diagnose 14
            exit 0
          fi
          # Burn the backlog: put back everything the pre-fix agent parked on
          # the email route by mistake, then work the whole queue.
          if [[ "${GITHUB_REF_NAME}" == fire-burn/* ]]; then
            echo "fire-burn branch: re-opening the misdiagnosed jobs first"
            # A measured batch, not the whole queue. The circuit breaker
            # stops it early if nothing is reaching a form, and the limit
            # keeps even a working run short enough to read the result and
            # decide, rather than spending an hour to find out.
            python portal_agent.py --reopen-fallbacks --run --submit \
              --limit "${BURN_LIMIT:-8}"
            exit 0
          fi
          ARGS="--harvest --run"
          # a fire-submit/* branch means: really apply, and only to one job
          if [[ "${GITHUB_REF_NAME}" == fire-submit/* ]]; then
            ARGS="$ARGS --submit --limit 1"
            echo "fire-submit branch: submitting ONE real application"
          elif [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python portal_agent.py $ARGS
          # Read back what this run just proved, so the next one starts
          # from it. Never allowed to fail the job.
          python learn.py --write || true

      - name: Build the CAPTCHA handoff page
        if: always()
        run: python tools/handoff.py

      - name: Keep the handoff page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captcha-handoff
          path: handoff/
          retention-days: 30
          if-no-files-found: ignore

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-screenshots
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore

      # The DOM of every page that beat the agent, with everything it typed
      # stripped out. A screenshot shows what a page looked like; only this
      # shows what the agent was reading. Downloaded, each one becomes an
      # offline fixture, so the next failure is reproduced in a unit test in
      # seconds instead of guessed at one twenty-minute run per guess.
      - name: Keep the pages that beat us
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-that-beat-us
          path: kept-pages/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit state
        if: always()
        env:
          TARGET: ${{ startsWith(github.ref_name, 'fire-') && github.event.repository.default_branch || github.ref_name }}
        run: bash .github/workflows/commit-state.sh "$TARGET" "portal"
