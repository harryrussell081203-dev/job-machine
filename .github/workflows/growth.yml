name: growth

# The acquisition engine. One job per agent, each on its own schedule, each
# committing its state back.
#
# FREE, AND NOW GENUINELY SO. The repository is public, which means Actions
# minutes are unlimited rather than capped at 2,000 a month. That cap is why
# sweep.yml was cut from eleven wake-ups a day to six on 20 September, and it
# is the reason this workflow could not have existed a day earlier.
#
# NOTHING HERE POSTS. crawl_health reads the live site and writes a file.
# listener reads a short allowlist of forums, writes a file, and once a week
# emails Harry a digest - no account access, no replies drafted. page_builder
# reads /employers.json from the live site and writes HTML files to
# growth/out/pages/roles/. Agents that would reach further - outreach,
# syndication, submissions - are gated in their own modules and several of
# them are human-gated by design. See GROWTH.md.

on:
  schedule:
    # Not on the hour: GitHub delays jobs scheduled at popular times, and this
    # workflow has no reason to compete for them.
    - cron: "25 6 * * *"
    # Listener: sweep forums daily, and fire again on Friday evening UK so
    # the agent lands inside its own email window. Two Friday entries cover
    # BST (17:03 UTC = 18:03 BST) and GMT (18:03 UTC = 18:03 GMT); the agent
    # dedupes itself with last_email_at.
    - cron: "7 7,13,19 * * 1-5"
    - cron: "3 17 * * 5"
    - cron: "3 18 * * 5"
  push:
    # Push a branch to force a run when the Actions UI is not to hand. The
    # same idiom the other workflows here use.
    branches: ["fire-growth/**"]
  workflow_dispatch: {}

# One at a time. Two runs committing growth/data/ together is a conflict on a
# file whose whole purpose is being a readable history.
concurrency:
  group: growth
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl_health:
    name: what a machine gets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Check every URL in the sitemap
        # Does not fail the workflow on a broken page, and that is
        # deliberate. A red cross here would mean "somebody else's page is
        # slow today" and would be ignored within a week. The agent's own
        # exit code is what distinguishes a run that found problems from one
        # that could not look at all.
        run: python -m growth.run crawl_health --base https://recruited.org.uk

      - name: Commit what it found
        run: |
          set -e
          git config user.name "growth"
          git config user.email "actions@github.com"
          if git diff --quiet -- growth/data/; then
            echo "nothing changed"
            exit 0
          fi
          git add growth/data/
          git commit -m "crawl health $(date -u +%F)"
          # Rebase rather than merge: this file is a log, the remote's copy is
          # never the one to keep, and a merge commit per day would bury the
          # history it exists to show.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** attempt))
          done
          echo "could not push"
          exit 1

  page_builder:
    name: role landing pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Build one page per qualifying role
        # Reads /employers.json from the live site, groups employers by
        # role, and writes HTML files. Idempotent via content hash: an
        # unchanged page is left alone, which keeps the diff reviewable.
        run: python -m growth.run page_builder --base https://recruited.org.uk

      - name: Commit the state and the pages
        run: |
          set -e
          git config user.name "growth"
          git config user.email "actions@github.com"
          if git diff --quiet -- growth/data/ growth/out/; then
            echo "nothing changed"
            exit 0
          fi
          git add growth/data/ growth/out/
          git commit -m "page builder $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** attempt))
          done
          echo "could not push"
          exit 1

  listener:
    name: who to reply to by hand
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Sweep the allowlist, maybe email the digest
        env:
          # When any of these is unset, the sweep still runs and queues
          # threads, and the agent surfaces "no mailer configured" in
          # for_review. The queue persists across runs, so a missing env
          # var defers the digest rather than losing it.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          LISTENER_TO: ${{ secrets.LISTENER_TO }}
          LISTENER_FROM: ${{ secrets.LISTENER_FROM }}
        run: python -m growth.run listener

      - name: Commit the queue
        run: |
          set -e
          git config user.name "growth"
          git config user.email "actions@github.com"
          if git diff --quiet -- growth/data/; then
            echo "nothing changed"
            exit 0
          fi
          git add growth/data/
          git commit -m "listener $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** attempt))
          done
          echo "could not push"
          exit 1
