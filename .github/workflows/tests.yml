name: tests

# The product and the growth agents have test suites and, until now, nothing ran them
# except a person remembering to. That is how two bugs reached this file's
# first commit:
#
#   - product/tests/test_harvest.py pinned "now" to a fixed date, so three
#     tests went red a week later without a line of code changing
#   - app/vault.py read CREDENTIAL_KEY at import, so fourteen tests passed
#     alone and errored in the full suite depending on import order
#
# Neither was hard to find once something looked. Nothing was looking.
#
# Free on GitHub's hardware for a public repository, and a couple of minutes
# a push if this ever goes private. It did go private, which is why the
# pull_request trigger is gone.
#
# EVERY PUSH TO A BRANCH WITH AN OPEN PR WAS BILLED TWICE.
#
# `push` fires on every branch, `pull_request` fires again on the same
# commit, and each runs both jobs - four billed runs per push, about five
# minutes, for two suites' worth of information. Fifteen pushes to one branch
# on 20 September cost seventy-five minutes and told us nothing the push
# trigger had not already said.
#
# `push` alone still covers every branch and every PR, because a PR from this
# repository is a branch in this repository. The one thing lost is the merge
# preview a pull_request run tests - main plus the branch, rather than the
# branch alone. Worth having and not worth double the allowance, on a
# repository whose branches are short-lived and merged the same day.

on:
  push:
    branches-ignore:
      # The fire-* branches exist to trigger a run, and several of them are
      # pushed and deleted in the same minute. Testing them is noise.
      - "fire-*/**"
      - "fire-*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # A push that supersedes another on the same branch makes the older run's
  # answer irrelevant, so cancel it - unlike the machines themselves, where
  # cancelling mid-send is the thing to avoid.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  growth:
    name: the growth agents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        # The same list growth.yml installs, so the tests run against what
        # production has.
        run: pip install requests
      - name: Test
        run: python -m unittest discover -s tests -v

  product:
    name: the product
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: product/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Test the pipeline
        # Two suites with two different roots, which is why they are two
        # steps rather than one discover: tests/ imports `jobseeker`, and
        # app/tests/ imports `app`.
        run: python -m unittest discover -s tests -t tests
      - name: Test the app
        run: python -m unittest discover -s app/tests -t .
