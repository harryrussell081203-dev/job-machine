name: outreach

# One letter, once, to each organisation that helps people into work:
# employability charities and job clubs, university and college careers
# services, council employment teams. Up to OUTREACH_PER_DAY (default 30) a
# weekday and OUTREACH_PER_RUN (default 150) a week. Never to a person's
# address, never twice to the same organisation, never from the mailbox the
# job hunt runs on. See product/outreach.py and product/app/org_outreach.py.
#
# The lists: the Charity Commission's register, filtered by tools/find_orgs.py
# to charities whose stated activities are getting people into work; UK
# universities and councils from Wikidata; England's colleges from the
# Department for Education's register. A list that cannot be fetched is
# skipped with a warning and the others still go.
#
# Sends nothing until there is an address for replies: the repository
# variable OUTREACH_REPLY_TO, or site_meta "outreach_reply_to" in the
# database (kept there so a personal address is not in a public repo). Until then every run is a rehearsal whose log shows
# the letters it would have sent. Off: OUTREACH_ENABLED=0.

on:
  schedule:
    # Every weekday, mid-morning UK, when an office inbox is read.
    - cron: "13 9 * * 1-5"
  workflow_dispatch:
    inputs:
      rehearse:
        description: "Find the addresses and write the letters, send nothing"
        type: boolean
        default: false
      only:
        description: "Just one kind of organisation"
        type: choice
        options: [all, charity, careers, council]
        default: all

permissions:
  contents: read

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: product/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Fetch the charity register
        env:
          CCEW_REGISTER_URL: ${{ vars.CCEW_REGISTER_URL || 'https://ccewuksprdoneregsadata1.blob.core.windows.net/data/txt/publicextract.charity.zip' }}
        run: |
          curl -sSfL "$CCEW_REGISTER_URL" -o register.zip
          unzip -o -q register.zip -d register
          ls -la register
      - name: Pick the organisations that help people into work
        run: python -m tools.find_orgs --from-file register/*.txt --out orgs.json
      - name: Universities and councils
        run: |
          for list in universities councils; do
            python -m tools.find_orgs --source "$list" --out "$list.json" || {
              echo "::warning::the $list list could not be fetched; skipped today"
              echo '[]' > "$list.json"
            }
          done
      - name: England's colleges
        run: |
          # The schools register is published daily under that day's date.
          for d in 0 1 2 3 4 5 6; do
            day=$(date -u -d "-$d day" +%Y%m%d)
            if curl -sSfL --max-time 300 -o gias.csv \
                "https://ea-edubase-api-prod.azurewebsites.net/edubase/downloads/public/edubasealldata$day.csv"; then
              break
            fi
            rm -f gias.csv
          done
          if [ -s gias.csv ] && python -m tools.find_orgs --from-file gias.csv --colleges --out colleges.json; then
            :
          else
            echo "::warning::the colleges list could not be fetched; skipped today"
            echo '[]' > colleges.json
          fi
      - name: Write to this week's
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CREDENTIAL_KEY: ${{ secrets.CREDENTIAL_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          APP_SMTP_ADDRESS: ${{ secrets.APP_SMTP_ADDRESS }}
          OUTREACH_ENABLED: ${{ inputs.rehearse && '0' || vars.OUTREACH_ENABLED }}
          OUTREACH_REPLY_TO: ${{ vars.OUTREACH_REPLY_TO }}
          OUTREACH_PER_RUN: ${{ vars.OUTREACH_PER_RUN }}
          OUTREACH_PER_DAY: ${{ inputs.rehearse && '12' || vars.OUTREACH_PER_DAY }}
          ONLY: ${{ inputs.only != 'all' && inputs.only || '' }}
          # The mail service only accepts the website's address, not a
          # GitHub runner's, so each letter is handed to the site to send.
          OUTREACH_SEND_VIA: ${{ vars.OUTREACH_SEND_VIA || 'site' }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL must be a repository secret."
            exit 1
          fi
          python -m app.org_outreach --orgs orgs.json --orgs universities.json \
            --orgs colleges.json --orgs councils.json ${ONLY:+--only "$ONLY"}
