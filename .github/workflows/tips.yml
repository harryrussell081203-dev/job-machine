name: tips

# The weekly job-hunting tips (product/app/tips.py): the next of eight short
# emails to each person who asked for them and confirmed, a week after their
# last one. Nobody else is ever emailed from here.
#
# Needs BREVO_API_KEY and APP_SMTP_ADDRESS as repository secrets, the same
# values Render already has for sign-in links. Without them the run fails
# loudly rather than pretending to send.
#
# Off: repository variable TIPS_ENABLED=0.

on:
  schedule:
    # Tuesdays, mid-morning UK. Not on the hour.
    - cron: "17 9 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tips
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: product/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Send the tips that are due
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CREDENTIAL_KEY: ${{ secrets.CREDENTIAL_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          APP_SMTP_ADDRESS: ${{ secrets.APP_SMTP_ADDRESS }}
          TIPS_ENABLED: ${{ vars.TIPS_ENABLED }}
        run: |
          if [ -z "${DATABASE_URL}" ] || [ -z "${BREVO_API_KEY}" ]; then
            echo "::error::DATABASE_URL and BREVO_API_KEY must be repository secrets."
            exit 1
          fi
          python -m app.tips
