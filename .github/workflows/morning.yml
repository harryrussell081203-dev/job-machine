name: job-machine morning

# The two or three things most worth doing today, texted at 07:45 UK.
#
# GitHub cron is UTC and does not shift with British Summer Time, so this
# fires at both 06:45 and 07:45 UTC and morning.py sends on whichever one is
# really 07:45 in Aberdeen - the same trick the nightly digest uses.
on:
  schedule:
    - cron: "45 6 * * *"
    - cron: "45 7 * * *"
  push:
    branches:
      - "fire-morning/**"      # send today's now, whatever the clock says
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-machine-morning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests dnspython

      # A fire-* branch carries whatever data/state.json looked like when the
      # branch was cut, and this list is read straight out of it. Without this
      # a forced run sends an empty CAPTCHA list while five are really waiting
      # - which is exactly what it did. See the long note in run.yml.
      - name: Start from the live state, not the branch's copy
        if: startsWith(github.ref_name, 'fire-')
        run: |
          DEFAULT="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT" --depth=1
          if git cat-file -e "origin/$DEFAULT:data/state.json" 2>/dev/null; then
            git checkout "origin/$DEFAULT" -- data/state.json
            echo "[state] working the live queue from $DEFAULT"
          else
            echo "[state] no state on $DEFAULT, using the branch's copy"
          fi

      - name: Text this morning's actions
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # The brief tops up the inbox register before it reads it, so it can
          # see mail that arrived overnight after the last two-hourly watch.
          # Without a key that triage falls back to a regex, which is worse -
          # it names the sender but cannot say what they actually want.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HTTPSMS_API_KEY: ${{ secrets.HTTPSMS_API_KEY }}
          SMS_FROM: ${{ vars.SMS_FROM }}
          MORNING_HOUR_UK: ${{ vars.MORNING_HOUR_UK }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == fire-morning/* ]]; then
            python morning.py --send --force
          else
            python morning.py --send
          fi

      # THE CAPTCHA LIST, IN THE MORNING, WHEN HE WILL ACT ON IT.
      #
      # It used to go out at 17:15 with the evening nudge. He asked for it in
      # the morning instead: he does the lot in one sitting at the desktop and
      # hands them back in one reply, so the list wants to arrive at the start
      # of the day it will be cleared, not the end of it.
      #
      # --scan first, deliberately. It reads his reply to YESTERDAY's list and
      # takes those off before today's is built, so the email he opens is only
      # what is actually left. Without that he would get this morning's list
      # still carrying last night's work.
      - name: Read yesterday's reply, then send today's CAPTCHA list
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python tools/applied.py --scan || true
          if [[ "${GITHUB_REF_NAME}" == fire-morning/* ]]; then
            python tools/handoff.py --email --force
          else
            python tools/handoff.py --email
          fi
          python tools/applied.py --list

      - name: Commit state
        if: always()
        env:
          TARGET: ${{ startsWith(github.ref_name, 'fire-') && github.event.repository.default_branch || github.ref_name }}
        run: bash .github/workflows/commit-state.sh "$TARGET" "morning"
