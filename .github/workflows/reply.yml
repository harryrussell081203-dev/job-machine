name: job-machine replies

# Interviews are won in the first hour of a recruiter replying, so this checks
# the inbox every two hours through the working day rather than waiting for the
# next full pipeline run. Interview invitations get an availability reply
# automatically; anything needing Harry raises an alert email immediately.
on:
  schedule:
    - cron: "15 7-17/2 * * 1-5"   # 07:15..17:15 UTC, weekdays
    # The weekend used to be silent, which was right when this only watched
    # for replies to letters the machine had sent - nobody in recruitment
    # answers one on a Sunday. It is not right now that it watches the whole
    # inbox: the Job Centre, a charity caseworker, and anyone who found Harry
    # himself all write at odd hours, and an interview invitation sitting
    # unseen from Friday evening to Monday morning is the single most
    # expensive thing this system could do. Twice a day is enough.
    - cron: "15 10,16 * * 6,0"    # Saturday and Sunday
  push:
    branches:
      - "fire-reply/**"     # check the mail now
      - "fire-inbox/**"     # the same, and say out loud what the register holds
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-machine-replies
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests dnspython

      - name: Check and handle replies
        env:
          # Python block-buffers stdout when it is a pipe, which is
          # what Actions gives it. Every log in this repo was flushed
          # in one lump at exit, so a run that was killed printed
          # nothing at all - forty-five minutes of silence that read
          # like a hang and was really an empty buffer.
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # httpSMS: the app on Harry's own phone. The key is a repo secret
          # and lives nowhere else - this repository is public. Without it
          # every texting path is simply skipped.
          HTTPSMS_API_KEY: ${{ secrets.HTTPSMS_API_KEY }}
          SMS_FROM: ${{ vars.SMS_FROM }}
          SMS_OUTBOUND: ${{ vars.SMS_OUTBOUND }}
          DAILY_SMS_CAP: ${{ vars.DAILY_SMS_CAP }}
          TEST_MODE: ${{ vars.TEST_MODE }}
          REPLY_AUTORESPOND: ${{ vars.REPLY_AUTORESPOND }}
        run: |
          # Mail from companies the machine wrote to: classified, answered if
          # it is an interview invitation, phone number harvested out of the
          # signature.
          python job_machine.py --replies
          # And everybody else. The reply watcher above walks state["jobs"] and
          # searches the inbox FROM each known contact, so a consultant who
          # found Harry on a job board and wrote to him cold was invisible to
          # it - which is a good half of the useful mail a live job hunt
          # produces. This reads the whole inbox, records what each message
          # wants, and puts an interview or a call-me on his phone now rather
          # than at six o'clock. Never allowed to fail the run: the reply
          # handling above is the part that must not be lost.
          python inbox_watch.py --send || true
          # On a fire-inbox branch, print everything still outstanding as well,
          # so the run log answers "what needs done" without opening the state
          # file. The scan above has already saved, so this reads, not writes.
          if [[ "${GITHUB_REF_NAME}" == fire-inbox/* ]]; then
            python inbox_watch.py --list || true
          fi

      - name: Commit state
        if: always()
        env:
          TARGET: ${{ startsWith(github.ref_name, 'fire-') && github.event.repository.default_branch || github.ref_name }}
        run: bash .github/workflows/commit-state.sh "$TARGET" "replies"
