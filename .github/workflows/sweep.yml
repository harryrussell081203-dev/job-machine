name: product sweep

# This is what makes it a product rather than a page somebody has to visit.
# Three times a weekday it looks for work for every paying user and sends
# whatever is due, so a subscriber who never signs in still gets letters out.
#
# It runs on GitHub's hardware, which is free for public repositories, so the
# scheduled compute costs nothing.
#
# ----------------------------------------------------------------------
# THIS FILE MUST LIVE AT .github/workflows/ IN THE REPOSITORY ROOT.
#
# It spent its whole life at product/.github/workflows/sweep.yml, where it
# was never once run and never could be. GitHub reads workflows from
# .github/workflows/ at the root and nowhere else, so a copy in a
# subdirectory is an inert text file that looks exactly like a working one -
# green in review, absent from the Actions tab, and silent about it.
#
# Scheduled workflows have a second rule that bit at the same time: cron only
# fires from the repository's DEFAULT BRANCH. On a feature branch this file
# is still dead even in the right directory. That is why the product had
# automatic sending written, tested, documented and sold, and had never sent
# a single letter.
#
# It runs against product/ via `working-directory` below. Do not move it back
# to sit beside the code it runs.
# ----------------------------------------------------------------------
#
# No workflow here triggers on a push at all.

on:
  schedule:
    # TWO SCHEDULES, AND THE MINUTE IS WHAT TELLS THEM APART.
    #
    # Minute :10 - a FULL sweep. Harvest listings, score them, write drafts,
    # then send whatever is due. Minutes of work and it spends the free
    # Adzuna, Reed and Gemini quotas, so three a day is the right number.
    #
    # Minute :40 - SEND ONLY. No job boards, no AI, no drafting: just read
    # the queue, notice replies, and post what is already written and already
    # past its holding window. It touches Postgres and Gmail and nothing
    # else, takes seconds, and costs no API quota at all.
    #
    # The second schedule exists because GitHub's free scheduler is late and
    # lossy, and the evidence is this workflow's own history. Every weekday
    # from 7 to 11 September it was set to run three times and ran TWICE, and
    # never once at a time in this file - the runs landed around 12:10 and
    # 18:25 UTC. On Monday 14 September nothing had run by 13:00, while a
    # finished letter sat in the queue from 23:03 the night before. Fourteen
    # hours, on a product whose whole promise is that letters go out without
    # anybody opening it.
    #
    # GitHub does not queue a delayed schedule, it drops it, so the answer is
    # more chances rather than better timing. Eleven a day instead of three
    # means a letter waits about an hour in the normal case instead of most
    # of a day, and the run that eventually fires has less to catch up on.
    #
    # This CANNOT send more letters than the user asked for. The daily cap is
    # counted against sent_log, the holding window against each draft's own
    # age, and one-employer-one-letter against the contacted table - all per
    # letter, none of them per run. Ten extra sweeps against a cap of twelve
    # send exactly what three would have sent, just sooner.
    #
    # Never on the hour: GitHub delays jobs scheduled at popular times.
    #
    # CUT FROM ELEVEN A DAY TO SIX, 20 SEP, AND THE REASON IS MINUTES.
    #
    # The repository is private, so Actions is capped at 2,000 minutes a
    # month, and on 20 September it had used 1,942 of them with ten days
    # left. This workflow was 496 of that - a quarter of the whole allowance
    # - to send 23 letters in thirty days, because eight of its eleven daily
    # wake-ups found nothing due and exited, each still paying for a
    # checkout and a pip install.
    #
    # Nothing about what gets sent changes. The comment above is the reason
    # it can be cut safely: the cap, the holding window and
    # one-employer-one-letter are all counted per letter, never per run, so
    # six sweeps send exactly what eleven sent, a little later in the day.
    - cron: "10 7,11,15 * * 1-5"
    - cron: "40 9,13,16 * * 1-5"
  # NO PUSH TRIGGER, EVER. On 22 September a history rewrite force-pushed
  # dozens of old fire-* branches at once, and every one that carried a push
  # trigger ran its own stale copy of the personal machine with a stale memory
  # of who had been written to. Agencies and forces charities got the same
  # letter three and four times. A schedule and a button are enough.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be sent, without sending"
        type: boolean
        default: false

# Reads the repository, writes nothing back to it. Everything this run
# produces goes to Postgres.
permissions:
  contents: read

concurrency:
  # Never two sweeps at once. Two overlapping runs could each read the same
  # draft as unsent and send it twice, which is the one mistake this whole
  # product is built to avoid.
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: product

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: product/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Sweep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CREDENTIAL_KEY: ${{ secrets.CREDENTIAL_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The cron expression that fired this run, empty for a manual run or
          # a branch push. Read below to pick the mode.
          FIRED_BY: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Without a database this would run against an empty SQLite file on
          # a throwaway runner: no users, no drafts, and a green tick saying
          # everything is fine. Refuse instead.
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is not set, so there are no users to"\
                 "sweep. Add it as a repository secret."
            exit 1
          fi

          # Which of the two schedules woke us. Matched on the MINUTE rather
          # than the whole expression on purpose: the hours above will get
          # tuned, and a match on the full string would silently turn every
          # send-only run into a full one the first time somebody edited them.
          # A run started by hand or by a fire-sweep/** push has no schedule
          # at all and gets the full sweep, which is what you want when you
          # have gone to the trouble of pressing the button.
          ARGS=""
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS="--dry-run"
          else
            case "${FIRED_BY}" in
              "40 "*) ARGS="--send-only" ;;
            esac
          fi
          echo "[sweep] fired by '${FIRED_BY:-manual}' -> app.sweep ${ARGS:-(full)}"
          python -m app.sweep ${ARGS}
