name: job-machine summary

# Five chances a night, and the script sends on the first one that lands at
# or after 22:00 UK. It will not send twice: summary_due() asks whether a
# digest has already gone out on this UK date rather than trusting the clock,
# so the other four stand down.
#
# Five, because GitHub does not promise to run a scheduled workflow on time -
# it queues them behind its own load - and the slip on this repository is not
# the half hour the August commit timestamps implied. Every scheduled summary
# run actually observed starting:
#
#     cron 22:00  ->  started 2026-09-05 23:44 UTC   1h44m late
#     cron 21:00  ->  started 2026-09-06 22:50 UTC   1h50m late
#     cron 22:00  ->  started 2026-09-06 23:43 UTC   1h43m late
#     cron 21:00  ->  not started by 2026-09-07 22:23 UTC, 1h23m and counting
#
# So the working assumption is a slip of roughly two hours, not thirty
# minutes. Against that, a 21:00 cron is not an evening job at all: it starts
# near midnight UK, and a 22:00 one starts after it, on tomorrow's date, where
# no gate can rescue it.
#
# The crons below are therefore spread so that at least one START lands inside
# 22:00-23:59 UK for any slip between zero and about three hours. The early
# ones are not "extra digests" - on a punctual night they are before 22:00 UK
# and stand down on the hour check, costing about fifteen seconds each.
on:
  schedule:
    - cron: "30 19 * * *"  # covers a slip of ~2.5-4h
    - cron: "30 20 * * *"  # covers a slip of ~1.5-3h
    - cron: "0 21 * * *"   # 22:00 BST / 21:00 GMT - punctual, and ~0-2h slip
    - cron: "0 22 * * *"   # 23:00 BST / 22:00 GMT
    - cron: "0 23 * * *"   # 23:00 GMT - the GMT backstop; in BST this is
                           # already tomorrow in the UK, so it stands down
  workflow_dispatch:
    inputs:
      force:
        description: "Send the digest now, ignoring the 22:00 UK gate (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: job-machine-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests dnspython

      - name: Send daily summary
        env:
          # Python block-buffers stdout when it is a pipe, which is
          # what Actions gives it. Every log in this repo was flushed
          # in one lump at exit, so a run that was killed printed
          # nothing at all - forty-five minutes of silence that read
          # like a hang and was really an empty buffer.
          PYTHONUNBUFFERED: "1"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_FROM: ${{ secrets.SMS_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python job_machine.py --summary --force
          else
            python job_machine.py --summary
          fi

      - name: Commit state
        if: always()
        env:
          TARGET: ${{ startsWith(github.ref_name, 'fire-') && github.event.repository.default_branch || github.ref_name }}
        run: bash .github/workflows/commit-state.sh "$TARGET" "summary"
