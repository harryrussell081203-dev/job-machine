name: job-machine summary

# Fires at 21:00 and 22:00 UTC every day. Exactly one of those is 22:00 in the
# UK whichever way the clocks are set, and the script sends only on that one.
on:
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send the digest now, ignoring the 22:00 UK gate (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: job-machine-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests dnspython

      - name: Send daily summary
        env:
          # Python block-buffers stdout when it is a pipe, which is
          # what Actions gives it. Every log in this repo was flushed
          # in one lump at exit, so a run that was killed printed
          # nothing at all - forty-five minutes of silence that read
          # like a hang and was really an empty buffer.
          PYTHONUNBUFFERED: "1"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_FROM: ${{ secrets.SMS_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
          # Optional. A free monitor's ping URL, so something OUTSIDE
          # GitHub notices if this stops running entirely - the one
          # case the machine cannot report on itself.
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          # Report in first. This workflow runs on its own schedule, so on a
          # day when the main run.yml cron was dropped by GitHub this may be
          # the only thing that fires - and therefore the only thing left
          # able to notice the silence and say so.
          python job_machine.py --heartbeat || true
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python job_machine.py --summary --force
          else
            python job_machine.py --summary
          fi

      - name: Commit state
        if: always()
        env:
          TARGET: ${{ startsWith(github.ref_name, 'fire-') && github.event.repository.default_branch || github.ref_name }}
        run: bash .github/workflows/commit-state.sh "$TARGET" "summary"
