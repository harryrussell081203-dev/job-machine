name: job-machine summary

# Three chances a night, and the script sends on the first one that lands
# after 22:00 UK. It will not send twice: summary_due() asks whether a digest
# has already gone out on this UK date rather than trusting the clock.
#
# Three, rather than the two this had, because GitHub does not promise to run
# a scheduled workflow on time - it queues them behind its own load. The gate
# used to be an exact hour match, and the three digests this repo ever sent
# arrived at 21:28, 21:35 and 21:36 UTC against a window that shut at 21:59.
# When the delay finally crossed the hour the run still went green and sent
# nothing, and that is how eleven consecutive nightly digests were lost.
on:
  schedule:
    - cron: "0 21 * * *"   # 22:00 BST / 21:00 GMT
    - cron: "0 22 * * *"   # 23:00 BST / 22:00 GMT
    - cron: "0 23 * * *"   # 23:00 GMT - the GMT backstop; in BST this is
                           # already tomorrow in the UK, so it stands down
  workflow_dispatch:
    inputs:
      force:
        description: "Send the digest now, ignoring the 22:00 UK gate (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: job-machine-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests dnspython

      - name: Send daily summary
        env:
          # Python block-buffers stdout when it is a pipe, which is
          # what Actions gives it. Every log in this repo was flushed
          # in one lump at exit, so a run that was killed printed
          # nothing at all - forty-five minutes of silence that read
          # like a hang and was really an empty buffer.
          PYTHONUNBUFFERED: "1"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_FROM: ${{ secrets.SMS_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python job_machine.py --summary --force
          else
            python job_machine.py --summary
          fi

      - name: Commit state
        if: always()
        env:
          TARGET: ${{ startsWith(github.ref_name, 'fire-') && github.event.repository.default_branch || github.ref_name }}
        run: bash .github/workflows/commit-state.sh "$TARGET" "summary"
