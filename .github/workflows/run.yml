name: job-machine

on:
  schedule:
    # Cold-outreach studies put the best open and reply rates on Tuesday to
    # Thursday, 9-11am in the reader's time zone. GitHub cron is UTC and does
    # not shift with British Summer Time, so both 8 and 9 UTC are scheduled on
    # those days: one of them is inside 9-11am UK whatever the season.
    - cron: "0 8 * * 2-4"     # 09:00 BST / 08:00 GMT - peak window
    - cron: "0 9 * * 2-4"     # 10:00 BST / 09:00 GMT - peak window
    # The other runs still harvest and score, and still send anything posted in
    # the last few hours, because being an early applicant beats being a
    # well-timed one. They just hold the bulk of the queue for the window.
    - cron: "0 8 * * 1,5"     # Monday and Friday morning
    - cron: "30 11 * * 1-5"   # 11:30 UTC weekdays
    - cron: "0 15 * * 1-5"    # 15:00 UTC weekdays
  push:
    tags: ["fire-run-*"]        # push a tag to force a run when the UI is not handy
    branches:
      - "fire-run/**"           # force an ordinary run
      - "fire-rescore/**"       # re-judge listings scored under an old profile
      - "fire-support/**"       # write to the charities and training bodies
      - "fire-signup/**"        # ask the veterans' services to register him
      - "fire-agencies/**"      # get on the recruitment agencies' databases
      - "fire-sms/**"           # prove the phone bridge works, text nobody else
      - "fire-tickets/**"       # ask the agencies about sponsoring OPITO tickets
      - "fire-chase/**"         # the second letter, to whoever never answered
      - "fire-ask/**"           # ask one person how they got offshore
      - "fire-meet/**"          # ask the agencies for twenty minutes in person
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE for this run (1 = everything goes to your own inbox)"
        required: false
        default: ""
      dry_run:
        description: "Compose but send nothing (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  # This used to be shared with portal.yml, to keep two scoring stages from
  # hitting Gemini at once. It cost far more than it saved.
  #
  # A GitHub concurrency group holds exactly ONE pending run. When a second
  # run queues behind an in-progress one, the first pending run is CANCELLED,
  # not queued after it - 'cancel-in-progress: false' only protects the run
  # that is already going. So every time portal.yml started while a run.yml
  # run was waiting, that run.yml run was silently dropped.
  #
  # On one day the scheduled 10:28, 11:14 and 13:13 sends were all cancelled
  # this way, along with every fire-rescore ever pushed. The pipeline looked
  # like it was running five times a day and was really sending on two.
  #
  # The 429s it was meant to prevent are already handled: the scorer backs off
  # on the retryDelay Gemini sends. Losing a send window is not recoverable.
  #
  # Per branch, and that is the whole point. Splitting run.yml away from
  # portal.yml was not enough: runs sit PENDING for twenty minutes or more
  # waiting for a hosted runner, and a group only ever holds one pending run,
  # so the next push into the same group deletes the one already waiting.
  #
  # fire-run/5 was cancelled at 17:31:05 by a fire-support branch pushed at
  # 17:31:03. It had been queued since 17:11 and had not executed a single
  # line. Every fire-* branch pushed today died exactly that way, including
  # several I killed myself by firing the next one.
  #
  # Keying on the ref means a fire-* branch can never cancel another branch's
  # run, and main's scheduled runs still serialise against each other, which
  # is the only place serialising was ever wanted.
  group: job-machine-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests dnspython reportlab

      # The same trap as portal.yml, and it bites harder here: a stale state
      # does not know who has already been written to, so a forced run on a
      # feature branch can send a second copy of a letter that went out days
      # ago. See the note in portal.yml. state.json only - every other file in
      # data/ is configuration a branch is allowed to change.
      - name: Start from the live state, not the branch's copy
        if: startsWith(github.ref_name, 'fire-')
        run: |
          DEFAULT="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT" --depth=1
          if git cat-file -e "origin/$DEFAULT:data/state.json" 2>/dev/null; then
            git checkout "origin/$DEFAULT" -- data/state.json
            python -c "import json;d=json.load(open('data/state.json'));print(f'[state] working the live queue: {len(d[\"jobs\"])} jobs from $DEFAULT')"
          else
            echo "[state] no state on $DEFAULT, using the branch's copy"
          fi

      - name: Run pipeline
        env:
          # Python block-buffers stdout when it is a pipe, which is
          # what Actions gives it. Every log in this repo was flushed
          # in one lump at exit, so a run that was killed printed
          # nothing at all - forty-five minutes of silence that read
          # like a hang and was really an empty buffer.
          PYTHONUNBUFFERED: "1"
          # secrets
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # httpSMS: the app on Harry's own phone. The key is a repo secret
          # and lives nowhere else - this repository is public. Without it
          # every texting path is simply skipped.
          HTTPSMS_API_KEY: ${{ secrets.HTTPSMS_API_KEY }}
          SMS_FROM: ${{ vars.SMS_FROM }}
          SMS_OUTBOUND: ${{ vars.SMS_OUTBOUND }}
          DAILY_SMS_CAP: ${{ vars.DAILY_SMS_CAP }}
          # repo variables (Settings > Secrets and variables > Actions > Variables).
          # TEST_MODE is unset by default, which means LIVE. Set it to 1 to send
          # everything to your own inbox instead.
          TEST_MODE: ${{ github.event.inputs.test_mode || vars.TEST_MODE }}
          DAILY_SEND_CAP: ${{ vars.DAILY_SEND_CAP }}
          PER_RUN_SEND_CAP: ${{ vars.PER_RUN_SEND_CAP }}
          SEARCH_LOCATIONS: ${{ vars.SEARCH_LOCATIONS }}
          SEARCH_RADIUS_MILES: ${{ vars.SEARCH_RADIUS_MILES }}
          SCORE_THRESHOLD: ${{ vars.SCORE_THRESHOLD }}
          SUPPORT_PER_RUN: ${{ vars.SUPPORT_PER_RUN }}
          AGENCY_REGISTER_GAP_DAYS: ${{ vars.AGENCY_REGISTER_GAP_DAYS }}
          AGENCY_REGISTER_MAX: ${{ vars.AGENCY_REGISTER_MAX }}
          AGENCY_REGISTER_PER_RUN: ${{ vars.AGENCY_REGISTER_PER_RUN }}
          AGENCY_PIPELINE_PER_RUN: ${{ vars.AGENCY_PIPELINE_PER_RUN }}
        run: |
          # The charities and training bodies that may fund the offshore
          # tickets and the driving licence. One approach each, ever.
          if [[ "${GITHUB_REF_NAME}" == fire-support/* ]]; then
            echo "fire-support branch: writing to the support organisations"
            python support_outreach.py --send
            exit 0
          fi
          # Just the two organisations that run the veterans' employment
          # services themselves, asking them to sign him up. Kept separate from
          # fire-support because that one empties the whole charity list, and
          # this errand is not a reason to post ten other letters.
          if [[ "${GITHUB_REF_NAME}" == fire-signup/* ]]; then
            echo "fire-signup branch: asking to be registered"
            python support_outreach.py --send --only registration
            exit 0
          fi
          # Twenty minutes across a desk. An email gets a CV onto a database;
          # a consultant who has met somebody puts them forward for the work
          # that never reaches an advert, which in Aberdeen energy is most of
          # it. Only to firms already written to - cold, it is a bigger ask.
          if [[ "${GITHUB_REF_NAME}" == fire-meet/* ]]; then
            echo "fire-meet branch: asking the agencies for a meeting"
            python agency_outreach.py --send --meet
            exit 0
          fi
          # The offshore-tickets question, to the agencies flagged for it.
          if [[ "${GITHUB_REF_NAME}" == fire-tickets/* ]]; then
            echo "fire-tickets branch: asking about OPITO sponsorship"
            python agency_outreach.py --send --tickets
            exit 0
          fi
          # A separate avenue, and the only one that asks for nothing: one
          # person, asked how they got their first offshore post. Deliberately
          # slow - two or three a week - because it only works while it looks
          # like a man asking around rather than a campaign.
          if [[ "${GITHUB_REF_NAME}" == fire-ask/* ]]; then
            echo "fire-ask branch: asking someone how they got offshore"
            python ask_around.py --send
            exit 0
          fi
          # The second letter. Thirty-one went out, three came back, and the
          # rest were left alone forever - the cheapest thing wrong with this
          # system, because the address is known and the reader already chosen.
          # One chase each, a working week later, threaded onto the original.
          if [[ "${GITHUB_REF_NAME}" == fire-chase/* ]]; then
            echo "fire-chase branch: following up the unanswered letters"
            python followup.py --send
            exit 0
          fi
          # One text to Harry's own phone, to prove the httpSMS key and the
          # handset are actually wired together. Sends to nobody else.
          if [[ "${GITHUB_REF_NAME}" == fire-sms/* ]]; then
            echo "fire-sms branch: testing the phone bridge"
            python sms.py --test
            exit 0
          fi
          # The recruitment agencies' own databases. Unlike everything else
          # here this one is meant to be fired again every few weeks: a
          # consultant's search results are ranked by how recently a candidate
          # was in touch, and the module's own cooldown decides who is due.
          if [[ "${GITHUB_REF_NAME}" == fire-agencies/* ]]; then
            echo "fire-agencies branch: registering with the agencies"
            python agency_outreach.py --send
            exit 0
          fi
          # A change to CANDIDATE_PROFILE invalidates every score already in
          # the file, so this re-opens the listings the scorer rejected and
          # judges them again before the run does anything else.
          ARGS=""
          if [[ "${GITHUB_REF_NAME}" == fire-rescore/* ]]; then
            echo "fire-rescore branch: re-judging against the current profile"
            ARGS="--rescore 55"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python job_machine.py --dry-run $ARGS
          else
            python job_machine.py $ARGS
          # Anyone who never answered, once, a working week on. After the
          # send so a letter posted this run is never chased in the same
          # breath.
          python followup.py --send || true
          # And one person asked how they got offshore. Its own cap and its
          # own spacing - see ask_around.py.
          python ask_around.py --send || true
          # Read back what this run just proved, so the next one starts
          # from it. Never allowed to fail the job.
          python learn.py --write || true
          fi

      - name: Commit state
        if: always()
        env:
          TARGET: ${{ startsWith(github.ref_name, 'fire-') && github.event.repository.default_branch || github.ref_name }}
        run: bash .github/workflows/commit-state.sh "$TARGET" "state"
