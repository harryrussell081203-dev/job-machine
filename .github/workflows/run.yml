name: job-machine

on:
  schedule:
    # Cold-outreach studies put the best open and reply rates on Tuesday to
    # Thursday, 9-11am in the reader's time zone. GitHub cron is UTC and does
    # not shift with British Summer Time, so both 8 and 9 UTC are scheduled on
    # those days: one of them is inside 9-11am UK whatever the season.
    - cron: "0 8 * * 2-4"     # 09:00 BST / 08:00 GMT - peak window
    - cron: "0 9 * * 2-4"     # 10:00 BST / 09:00 GMT - peak window
    # The other runs still harvest and score, and still send anything posted in
    # the last few hours, because being an early applicant beats being a
    # well-timed one. They just hold the bulk of the queue for the window.
    - cron: "0 8 * * 1,5"     # Monday and Friday morning
    - cron: "30 11 * * 1-5"   # 11:30 UTC weekdays
    - cron: "0 15 * * 1-5"    # 15:00 UTC weekdays
  push:
    tags: ["fire-run-*"]        # push a tag to force a run when the UI is not handy
    branches:
      - "fire-run/**"           # force an ordinary run
      - "fire-rescore/**"       # re-judge listings scored under an old profile
      - "fire-support/**"       # write to the charities and training bodies
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE for this run (1 = everything goes to your own inbox)"
        required: false
        default: ""
      dry_run:
        description: "Compose but send nothing (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  # This used to be shared with portal.yml, to keep two scoring stages from
  # hitting Gemini at once. It cost far more than it saved.
  #
  # A GitHub concurrency group holds exactly ONE pending run. When a second
  # run queues behind an in-progress one, the first pending run is CANCELLED,
  # not queued after it - 'cancel-in-progress: false' only protects the run
  # that is already going. So every time portal.yml started while a run.yml
  # run was waiting, that run.yml run was silently dropped.
  #
  # On one day the scheduled 10:28, 11:14 and 13:13 sends were all cancelled
  # this way, along with every fire-rescore ever pushed. The pipeline looked
  # like it was running five times a day and was really sending on two.
  #
  # The 429s it was meant to prevent are already handled: the scorer backs off
  # on the retryDelay Gemini sends. Losing a send window is not recoverable.
  group: job-machine-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests dnspython reportlab

      - name: Run pipeline
        env:
          # Python block-buffers stdout when it is a pipe, which is
          # what Actions gives it. Every log in this repo was flushed
          # in one lump at exit, so a run that was killed printed
          # nothing at all - forty-five minutes of silence that read
          # like a hang and was really an empty buffer.
          PYTHONUNBUFFERED: "1"
          # secrets
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # repo variables (Settings > Secrets and variables > Actions > Variables).
          # TEST_MODE is unset by default, which means LIVE. Set it to 1 to send
          # everything to your own inbox instead.
          TEST_MODE: ${{ github.event.inputs.test_mode || vars.TEST_MODE }}
          DAILY_SEND_CAP: ${{ vars.DAILY_SEND_CAP }}
          PER_RUN_SEND_CAP: ${{ vars.PER_RUN_SEND_CAP }}
          SEARCH_LOCATIONS: ${{ vars.SEARCH_LOCATIONS }}
          SEARCH_RADIUS_MILES: ${{ vars.SEARCH_RADIUS_MILES }}
          SCORE_THRESHOLD: ${{ vars.SCORE_THRESHOLD }}
          SUPPORT_PER_RUN: ${{ vars.SUPPORT_PER_RUN }}
        run: |
          # The charities and training bodies that may fund the offshore
          # tickets and the driving licence. One approach each, ever.
          if [[ "${GITHUB_REF_NAME}" == fire-support/* ]]; then
            echo "fire-support branch: writing to the support organisations"
            python support_outreach.py --send
            exit 0
          fi
          # A change to CANDIDATE_PROFILE invalidates every score already in
          # the file, so this re-opens the listings the scorer rejected and
          # judges them again before the run does anything else.
          ARGS=""
          if [[ "${GITHUB_REF_NAME}" == fire-rescore/* ]]; then
            echo "fire-rescore branch: re-judging against the current profile"
            ARGS="--rescore 55"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python job_machine.py --dry-run $ARGS
          else
            python job_machine.py $ARGS
          fi

      - name: Commit state
        if: always()
        env:
          TARGET: ${{ startsWith(github.ref_name, 'fire-') && github.event.repository.default_branch || github.ref_name }}
        run: bash .github/workflows/commit-state.sh "$TARGET" "state"
