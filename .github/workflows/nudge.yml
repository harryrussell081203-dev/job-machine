name: job-machine captcha nudge

# One text a day about the applications that are filled in and waiting on a
# bot check.
#
# These are the most valuable records in the state file - the work is already
# done, they are one puzzle away from being sent - and the easiest to forget,
# because they live in a build artifact nobody opens. Hence a text.
#
# THE EMAIL HAS MOVED TO THE MORNING. Harry does the whole list in one sitting
# at the desktop and hands them all back in one reply, so the list wants to
# arrive at the START of the day it will be cleared - see morning.yml.
#
# What is left here is the text, and only as a backstop: if the morning list
# is still sitting untouched by the evening, one line on the phone saying how
# many are waiting. It sends nothing when there is nothing waiting, so a day
# he clears them is a day he hears nothing more about it.
#
# 17:15 UTC is 18:15 BST and 17:15 GMT.
on:
  schedule:
    - cron: "15 17 * * *"   # 18:15 BST / 17:15 GMT
    - cron: "15 18 * * *"   # the other side of British Summer Time
  push:
    branches:
      - "fire-nudge/**"        # send today's nudge now, whatever the clock says
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-machine-nudge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests dnspython

      # A fire-* branch carries whatever data/state.json looked like when the
      # branch was cut, and this list is read straight out of it. Without this
      # a forced run sends an empty CAPTCHA list while five are really waiting
      # - which is exactly what it did. See the long note in run.yml.
      - name: Start from the live state, not the branch's copy
        if: startsWith(github.ref_name, 'fire-')
        run: |
          DEFAULT="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT" --depth=1
          if git cat-file -e "origin/$DEFAULT:data/state.json" 2>/dev/null; then
            git checkout "origin/$DEFAULT" -- data/state.json
            echo "[state] working the live queue from $DEFAULT"
          else
            echo "[state] no state on $DEFAULT, using the branch's copy"
          fi

      - name: Email the filled-in page, and text the link
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # The digest covers the whole inbox now, not just the replies, and
          # the triage that turns a message into "what needs done" is a model
          # call. See inbox_watch.py.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HTTPSMS_API_KEY: ${{ secrets.HTTPSMS_API_KEY }}
          SMS_FROM: ${{ vars.SMS_FROM }}
        run: |
          # A fire-nudge branch is a person asking for it now, so it overrides
          # the once-a-day guard. The schedule never does.
          # The email carries the page with the one-click prefill on it, for
          # the desktop. The text carries one link, for the phone. Both from
          # the same moment so they arrive together and agree with each other.
          # Anything he has already cleared comes off before we count.
          python tools/applied.py --scan || true
          # Top up the inbox register first. The two-hourly watcher last ran at
          # 17:15 UTC, so without this the digest would miss anything that
          # arrived in the last hour - which is exactly the mail that is still
          # unread when he picks up the phone.
          python inbox_watch.py --send || true
          # What came in today and what to do about it. His words: "a lot of
          # people just call me randomly as a result of the system working and
          # I have to figure out on the fly who's calling". One text at six,
          # and tomorrow's callers are people he is expecting. Covers the
          # replies AND the rest of the mail - "for all of my emails".
          if [[ "${GITHUB_REF_NAME}" == fire-nudge/* ]]; then
            python evening.py --send --force || true
          else
            python evening.py --send || true
          fi
          if [[ "${GITHUB_REF_NAME}" == fire-nudge/* ]]; then
            python tools/handoff.py --email --force
            python sms.py --captcha-nudge --force
          else
            python sms.py --captcha-nudge
          fi

      - name: Commit state
        if: always()
        env:
          TARGET: ${{ startsWith(github.ref_name, 'fire-') && github.event.repository.default_branch || github.ref_name }}
        run: bash .github/workflows/commit-state.sh "$TARGET" "nudge"
