<!doctype html>
<!--
  The other half of the same failure: an employer's own careers page that
  embeds its ATS in an iframe.

  Everything inside that frame is invisible to a script running against the top
  document, so the agent counted the two fields on the wrapper page and gave up
  on a form that was sitting right there.
-->
<html>
<head><meta charset="utf-8"><title>Careers - Apply</title></head>
<body>
<h1>Work with us</h1>

<form id="newsletter">
  <label>Email me new jobs <input name="email" type="email"></label>
  <button type="button">Sign up</button>
</form>

<iframe id="ats" src="fake_ats.html" width="900" height="700" title="Application form"></iframe>
</body>
</html>
